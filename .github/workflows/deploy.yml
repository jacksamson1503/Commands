name: CI/CD - Docker, ECR and EC2 Blue-Green

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} .
          docker tag ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} ${REGISTRY}/${ECR_REPOSITORY}:latest

      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${ECR_REPOSITORY}:latest

      - name: Deploy Green container on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,REGISTRY,ECR_REPOSITORY,IMAGE_TAG
          script: |
            set -e

            IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Logging Docker into ECR..."
            aws ecr get-login-password --region "$AWS_REGION" |               docker login --username AWS --password-stdin "$REGISTRY"

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Starting Green container..."
            docker rm -f commands-green 2>/dev/null || true

            docker run -d               --name commands-green               --restart unless-stopped               -p 8081:80               "$IMAGE"

            echo "Waiting for Green container..."
            sleep 5

            echo "Running health check..."
            curl -fsS http://127.0.0.1:8081/ > /dev/null

            echo "Green deployment successful."
            echo "Green is running on port 8081."
            echo "Blue is intentionally left running for rollback."
