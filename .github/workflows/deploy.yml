name: CI/CD Pipeline - Zero-Downtime Blue/Green Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-and-deploy:
    name: Build, Push to ECR & Blue/Green Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build, tag, and push Docker image to Amazon ECR
      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          echo "Pushing Docker images to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Step 5: Connect to EC2 and Execute Blue/Green Deployment
      - name: Execute Blue/Green Deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,REGISTRY
          script: |
            set -e

            # 1. Download latest deploy script
            curl -sSL https://raw.githubusercontent.com/jacksamson1503/Commands/main/scripts/deploy.sh -o /home/${{ secrets.EC2_USER }}/deploy.sh
            chmod +x /home/${{ secrets.EC2_USER }}/deploy.sh

            # 2. Log in Docker to Amazon ECR on EC2 using AWS CLI
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY

            # 3. Execute zero-downtime Blue/Green swap
            /home/${{ secrets.EC2_USER }}/deploy.sh "$REGISTRY/${{ secrets.ECR_REPOSITORY_NAME }}:${{ github.sha }}"
